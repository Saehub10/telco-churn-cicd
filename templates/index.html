<!doctype html><html lang="es"><meta charset="utf-8"><title>Telco Churn</title><body><h1>Telco Churn Predictor</h1><form id="f"><input name="tenure" type="number" value="5" placeholder="tenure"><input name="MonthlyCharges" type="number" step=".01" value="85.5"><input name="TotalCharges" type="number" step=".01" value="427.5"><select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select><select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select><button>Predecir</button></form><pre id="out"></pre><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));for(let k of ['tenure','MonthlyCharges','TotalCharges'])d[k]=Number(d[k]);let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
